on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@master
    - name: Deploy code to Lambda
      uses: aws-actions/configure-aws-credentials@v1
      with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
    - name: Build requirements 
      run: |
        
        python3 -m venv build
        pip3 install wheel
        cp requirements.txt build/
        cp lambda_function.py build/
        cd build 
        source bin/activate 
        pip3 install -r requirements.txt
        cd lib/*/site-packages 
        zip -r ../../../get_sfn_executions_daily.zip . 
        cd ../../../
        zip -g get_sfn_executions_daily.zip lambda_function.py
        aws lambda update-function-code --function-name=get_sfn_executions_daily --zip-file=fileb://get_sfn_executions_daily.zip
        aws lambda wait function-updated --function-name=get_sfn_executions_daily
    - name: Configure Lambda environment
      run: |
        STATE_MACHINE_ARNS="arn:aws:states:eu-west-1:750014326377:stateMachine:WakeupFarms_StepFunctions_v16-Bigquerygcp"
        CURRENT_ENV=$(aws lambda get-function-configuration \
          --function-name=get_sfn_executions_daily \
          --query 'Environment.Variables' \
          --output json)
        UPDATED_ENV=$(jq -cn \
          --argjson current "${CURRENT_ENV:-null}" \
          --arg state_machine_arns "$STATE_MACHINE_ARNS" \
          '{Variables: (($current // {}) + {STATE_MACHINE_ARNS: $state_machine_arns})}')
        aws lambda update-function-configuration \
          --function-name=get_sfn_executions_daily \
          --environment "$UPDATED_ENV"
        aws lambda wait function-updated --function-name=get_sfn_executions_daily
